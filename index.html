<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROJECT NUM.COM</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#080d19;color:white;font-family:Arial}
.container{max-width:500px;margin:auto}
header{text-align:center;padding:20px}
h1{color:#32aaff;letter-spacing:3px}
.card{background:#111b2d;padding:20px;border:1px solid #263b58;border-radius:16px;margin:18px 0}
input{width:100%;padding:15px;margin-top:12px;background:#080f1d;border:1px solid #344b69;border-radius:9px;color:white;font-size:17px}
button{width:100%;padding:15px;margin-top:15px;background:#087cff;color:white;border:0;border-radius:9px;font-weight:bold}
.result{background:#19273e;padding:13px;margin-top:10px;border-radius:8px}
.value{color:#39b4ff;margin-top:6px;overflow-wrap:anywhere}
label{color:#aab9ce;font-size:13px}
footer{text-align:center;color:#78869c;font-size:12px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>NUM.COM</h1>
<p>PROFESSIONAL NUMBER ANALYZER</p>
</header>

<div class="card">
<h3>NUMBER LOOKUP</h3>
<label>Enter number with country code</label>
<input id="phone" type="tel" placeholder="+91 9876543210">
<button onclick="analyze()">ANALYZE NUMBER</button>
</div>

<div class="card">
<h3>ANALYSIS RESULTS</h3>
<div class="result"><label>Country</label><div class="value" id="country">Waiting...</div></div>
<div class="result"><label>Country Code</label><div class="value" id="code">Waiting...</div></div>
<div class="result"><label>Number Type</label><div class="value" id="type">Waiting...</div></div>
<div class="result"><label>Validation</label><div class="value" id="valid">Waiting...</div></div>
<div class="result"><label>International Format</label><div class="value" id="format">Waiting...</div></div>
<div class="result"><label>Operator</label><div class="value">Authorized API required</div></div>
<div class="result"><label>Spam Check</label><div class="value">Authorized API required</div></div>
</div>
<footer>NUM.COM V1.1 | PRIVACY FIRST</footer>
</div>

<script src="https://unpkg.com/libphonenumber-js/bundle/libphonenumber-js.min.js"></script>
<script>
function analyze(){
 const input=document.getElementById("phone").value.trim();
 const fields=["country","code","type","valid","format"];
 fields.forEach(id=>document.getElementById(id).textContent="Analyzing...");

 try{
  if(!window.libphonenumber){
   throw new Error("Number library not loaded. Check internet.");
  }

  const phone=libphonenumber.parsePhoneNumberFromString(input);

  if(!phone){
   throw new Error("Invalid number format");
  }

  const countryNames=new Intl.DisplayNames(["en"],{type:"region"});
  document.getElementById("country").textContent=
   phone.country ? countryNames.of(phone.country) : "Unknown";

  document.getElementById("code").textContent=
   "+"+phone.countryCallingCode;

  document.getElementById("type").textContent=
   phone.getType() || "Unknown";

  document.getElementById("valid").textContent=
   phone.isValid() ? "Valid numbering format" : "Invalid number range";

  document.getElementById("format").textContent=
   phone.formatInternational();

 }catch(error){
  fields.forEach(id=>document.getElementById(id).textContent="Not available");
  document.getElementById("valid").textContent=error.message;
 }
}
</script>
</body>
                                                                                              </html>
